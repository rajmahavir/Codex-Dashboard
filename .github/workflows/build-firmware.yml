name: Build Slot B application

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install pinned core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'LovyanGFX@1.2.32' 'ArduinoJson@7.4.2' 'lvgl@8.3.11'
      - name: Prepare sketch
        run: |
          python3 scripts/pack_web.py
          mkdir -p sketch/CodexDashboard
          cp src/*.cpp src/*.c src/*.h sketch/CodexDashboard/
          touch sketch/CodexDashboard/CodexDashboard.ino
      - name: Build app-only firmware
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,USBMode=default,CDCOnBoot=cdc' --build-property "compiler.c.extra_flags=-DLV_CONF_INCLUDE_SIMPLE -I$PWD/sketch/CodexDashboard" --build-property "compiler.cpp.extra_flags=-DLV_CONF_INCLUDE_SIMPLE -I$PWD/sketch/CodexDashboard" --build-path build/arduino sketch/CodexDashboard
          python3 scripts/test_slots.py
      - name: Package Slot B application
        run: |
          mkdir -p artifact
          cp build/arduino/CodexDashboard.ino.bin artifact/codex-dashboard-slot-b.bin
          cp partitions.csv artifact/partitions-reference-only.csv
          printf '%s\n' 'APP ONLY: 0x310000, max 0x300000 bytes. Requires the verified ESPINFO 16 MiB two-slot layout. Preserve Slot A, NVS, bootloader and partition table. See repository README before installation. Do not flash the reference CSV.' > artifact/README.txt
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-dashboard-slot-b-app
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
