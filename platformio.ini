; Slot B app-only build configuration. The verified local build uses scripts/build.py.
; Ordinary Upload is blocked because it would overwrite ESPINFO/boot metadata.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = scripts/block_platformio_upload.py
lib_deps =
  lovyan03/LovyanGFX@1.2.32
  bblanchon/ArduinoJson@7.4.2
  lvgl/lvgl@8.3.11
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I src
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
