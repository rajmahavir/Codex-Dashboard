[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchet/ArduinoJson@^7.4.2
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  -D TFT_MOSI=45
  -D TFT_SCLK=40
  -D TFT_CS=42
  -D TFT_DC=41
  -D TFT_RST=39
  -D TFT_BL=46
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D SMOOTH_FONT=1
